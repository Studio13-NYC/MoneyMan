<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; script-src 'self'" />
  <title>MoneyMan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <h1>MoneyMan</h1>
      </div>
      <p class="tagline">OpenAI & Cursor spend this month</p>
    </header>

    <main class="main">
      <section class="cards">
        <article class="card card-openai">
          <div class="card-label">OpenAI</div>
          <div class="card-value" data-value="openai">—</div>
          <div class="card-meta" data-meta="openai"></div>
        </article>
        <article class="card card-cursor">
          <div class="card-label">Cursor</div>
          <div class="card-value" data-value="cursor">—</div>
          <div class="card-meta" data-meta="cursor"></div>
        </article>
      </section>
      <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total-value" data-total>—</span>
      </div>
      <div class="updated-row">
        <span data-updated></span>
        <button type="button" class="btn btn-refresh" id="run-now" title="Fetch latest spend">Refresh</button>
      </div>

      <section class="settings">
        <h2 class="settings-title">Settings</h2>
        <div class="setting">
          <label for="poll-interval">Poll every (minutes)</label>
          <input type="number" id="poll-interval" min="5" max="1440" step="5" value="15" />
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Runs in system tray • Notifications when spend changes</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
